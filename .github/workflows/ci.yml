name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medcourse
          POSTGRES_PASSWORD: medcourse
          POSTGRES_DB: medcourse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medcourse -d medcourse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Enables the database integration tests (packages/db).
      DATABASE_URL: postgres://medcourse:medcourse@localhost:5432/medcourse
    steps:
      - uses: actions/checkout@v4
      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [bot, worker, panel]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg APP=${{ matrix.app }} -t medcourse-${{ matrix.app }}:ci .
